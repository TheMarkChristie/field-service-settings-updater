name: panthers_app
description: "The fan ownership app: Boardroom voting, Match Centre, Panthers TV. Consumes the WordPress plugin's prx3/v1 API."
publish_to: "none"
version: 0.3.1+6

environment:
  sdk: ">=3.3.0 <4.0.0"

# Minimum OS floor per spec T67: iOS 15 / Android 8 (set in platform folders
# when `flutter create .` generates them — see README).
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0   # JWT storage (T6)
  url_launcher: ^6.2.0             # Web checkout link-out (T33)
  image_picker: ^1.1.0             # Profile photo + consent gallery (FO-320)
  firebase_core: ^3.0.0            # FCM push (T14) — configure per project
  firebase_messaging: ^15.0.0
  # sentry_flutter (Error tracking, T56) re-added at app CI kickoff on a
  # Kotlin-2.0-compatible release (>=9.x); 8.x pins Kotlin languageVersion
  # 1.6 which the current Android toolchain rejects. Not yet initialised in
  # code, so removing it changes no behaviour.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Per-club launcher icon generation. The build downloads the club's
# app_icon from the brand pack to assets/branding/app_icon.png and runs
# `dart run flutter_launcher_icons`; if no club icon is set, the default
# Flutter launcher icon is kept.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
