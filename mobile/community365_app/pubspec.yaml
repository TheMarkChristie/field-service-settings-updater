name: community365
description: The 365 Community reader — blogs, events, podcasts, and videos from the community, with offline reading and category preferences.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.2.3      # simple settings (offline limit, theme mode)
  flutter_secure_storage: ^9.2.2  # WordPress username + application password
  sqflite: ^2.3.3                 # offline post cache
  path: ^1.9.0
  path_provider: ^2.1.3

  # UI / content
  cached_network_image: ^3.3.1        # image caching for the feed and reader
  flutter_widget_from_html_core: ^0.15.2  # native rendering of post HTML
  url_launcher: ^6.3.0                # open podcasts/videos/source externally
  intl: ^0.19.0                       # date formatting

  # Push notifications (new content in the member's categories)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
