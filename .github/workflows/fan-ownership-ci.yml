name: Fan Ownership CI
on:
  pull_request:
    paths: ['fan-ownership/**']
  push:
    branches: [main]
    paths: ['fan-ownership/**']
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fan-ownership/plugin/fan-ownership-platform
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP lint
        run: |
          fails=0
          for f in $(find . -name '*.php'); do php -l "$f" > /dev/null || fails=1; done
          exit $fails
      - name: Money/vote path test suite
        run: php tests/run-tests.php
      - name: JS syntax
        run: |
          for f in assets/js/*.js; do node --check "$f"; done
          node --check ../../services/chat-server/server.js
  wpcs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fan-ownership/plugin/fan-ownership-platform
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Install WordPress coding standards
        run: |
          composer global require --no-interaction squizlabs/php_codesniffer wp-coding-standards/wpcs \
            phpcsstandards/phpcsutils phpcsstandards/phpcsextra dealerdirect/phpcodesniffer-composer-installer
      - name: phpcs (WordPress ruleset)
        run: ~/.composer/vendor/bin/phpcs . --standard=phpcs.xml.dist || ~/.config/composer/vendor/bin/phpcs . --standard=phpcs.xml.dist
