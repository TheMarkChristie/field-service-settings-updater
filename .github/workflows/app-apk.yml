name: Build App APK
# Builds the companion Flutter app into an installable Android APK on
# GitHub's runners (the container that develops the plugin has
# dl.google.com blocked, so the Android SDK cannot be fetched there).
# Download the APK from the run's Artifacts once the job is green.
on:
  workflow_dispatch:
  push:
    branches: [claude/sports-fan-ownership-plugin-2r2rh8, main]
    paths: ['fan-ownership/app/**', '.github/workflows/app-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fan-ownership/app/panthers_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Fetch packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panthers-app-release-apk
          path: fan-ownership/app/panthers_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
