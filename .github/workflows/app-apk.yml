name: Build App APK
# Builds the companion Flutter app into an installable Android APK on
# GitHub's runners (the container that develops the plugin has
# dl.google.com blocked, so the Android SDK cannot be fetched there).
# The APK is uploaded as a run Artifact AND published as an asset on the
# "panthers-app-latest" GitHub Release for a direct one-click download.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'PRX3 API base URL the app talks to'
        required: false
        default: 'https://perthpanthersihc.com/wp-json/prx3/v1'
  push:
    branches: [claude/sports-fan-ownership-plugin-2r2rh8, main]
    paths: ['fan-ownership/app/**', '.github/workflows/app-apk.yml']
env:
  # Panthers-pointed build; override via the workflow_dispatch input.
  PRX3_API: ${{ github.event.inputs.api_base || 'https://perthpanthersihc.com/wp-json/prx3/v1' }}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fan-ownership/app/panthers_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Fetch packages
        run: flutter pub get
      - name: Resolve club branding from the brand pack
        # Read the club name + app_icon from the public /config endpoint so
        # each club's binary carries its own launcher name and icon. All
        # best-effort: if the site or fields are absent, the defaults stand.
        run: |
          CFG=$(curl -sS --max-time 20 "$PRX3_API/config" || echo '{}')
          NAME=$(printf '%s' "$CFG" | python3 -c "import sys,json;print((json.load(sys.stdin).get('club',{}) or {}).get('name','') or '')" 2>/dev/null || echo '')
          ICON=$(printf '%s' "$CFG" | python3 -c "import sys,json;c=json.load(sys.stdin).get('club',{}) or {};print(c.get('app_icon') or c.get('badge_social') or c.get('badge') or '')" 2>/dev/null || echo '')
          echo "CLUB_NAME=$NAME" >> "$GITHUB_ENV"
          echo "CLUB_ICON=$ICON" >> "$GITHUB_ENV"
          echo "Resolved club name='$NAME' icon='$ICON'"
      - name: Set launcher app name
        if: env.CLUB_NAME != ''
        run: |
          python3 - "$CLUB_NAME" <<'PY'
          import re, sys
          name = sys.argv[1].replace('"', '')
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'android:label="[^"]*"', 'android:label="%s"' % name, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Set launcher label to', name)
          PY
      - name: Generate launcher icon from the brand pack
        if: env.CLUB_ICON != ''
        run: |
          set +e
          mkdir -p assets/branding
          curl -sSL --max-time 30 "$CLUB_ICON" -o /tmp/icon.src || exit 0
          if command -v convert >/dev/null 2>&1; then
            convert /tmp/icon.src -resize 1024x1024^ -gravity center -extent 1024x1024 assets/branding/app_icon.png \
              || cp /tmp/icon.src assets/branding/app_icon.png
          else
            cp /tmp/icon.src assets/branding/app_icon.png
          fi
          dart run flutter_launcher_icons || echo "icon generation skipped"
          exit 0
      - name: Analyze
        # Real compile errors still fail the build; lint infos/warnings
        # (e.g. framework deprecations) do not block producing the APK.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release --dart-define=PRX3_API="$PRX3_API"
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/panthers-app.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panthers-app-release-apk
          path: fan-ownership/app/panthers_app/build/app/outputs/flutter-apk/panthers-app.apk
          if-no-files-found: error
      - name: Publish APK to a GitHub Release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panthers-app-latest
          name: Panthers App (latest build)
          body: |
            Latest release APK of the Panthers companion app, built
            automatically from the app source.

            **API endpoint:** ${{ env.PRX3_API }}

            Download `panthers-app.apk` below and sideload it on Android
            (allow "Install unknown apps").
          prerelease: true
          files: fan-ownership/app/panthers_app/build/app/outputs/flutter-apk/panthers-app.apk
